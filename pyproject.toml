[project]
name = "redox"
version = "2.0.0"
description = "Pydantic models for producing, ingesting, and validating Redox data-model JSON payloads."
authors = [{ name = "Mike Mabey", email = "pypi@mikemabey.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
keywords = ["redox", "pydantic", "healthcare", "hl7", "ehr", "interoperability"]
dependencies = [
    "pydantic>=2.11",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/mmabey/redox"
Repository = "https://github.com/mmabey/redox"
Issues = "https://github.com/mmabey/redox/issues"
Documentation = "https://redox.readthedocs.io"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.0",
    "ruff>=0.6",
    "ty>=0.0.70",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
    "coveralls>=3.0.1",
]

[tool.coverage.run]
source = ["redox"]
omit = ["redox/generic/*"]

[tool.ty.src]
# The generated model tree is ~thousands of forward-ref'd classes; ruff covers
# it. Type-check the hand-written core only.
include = ["redox/abstract_base.py", "redox/factory.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["redox/py.typed"]

# Lint config lives in .ruff.toml (regenerated by gen_redox_lib on every run).
